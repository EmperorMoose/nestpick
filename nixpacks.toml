# Railway / Nixpacks build config for the House Dashboard monorepo.
# The backend (FastAPI) serves the React frontend as static files.

[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
    "cd frontend && npm ci",
    "python3 -m pip install -r backend/requirements.txt",
]

[phases.build]
cmds = [
    "cd frontend && npm run build",
]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
